<header class="topbar" [class.expanded]="!sidebarService.collapsed()">

  <div class="topbar__left">
    <button class="btn-icon" (click)="sidebarService.toggle()" title="Alternar barra lateral">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="topbar__right">

    <div class="user-chip" [class.open]="dropdownOpen" (click)="toggleDropdown()">
      <div class="avatar-circle">{{ getInitial() }}</div>
      <div class="chip-info">
        <span class="chip-name">{{ authService.getUsername() }}</span>
        <span class="chip-status">
          <span class="status-dot"></span>
          Sesión activa
        </span>
      </div>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           class="chevron" [class.rotated]="dropdownOpen">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </div>

    <div class="user-dropdown" [class.open]="dropdownOpen">
      <div class="dropdown-header">
        <div class="dropdown-avatar">{{ getInitial() }}</div>
        <div>
          <div class="dropdown-name">{{ authService.getUsername() }}</div>
          <div class="dropdown-role">Administrador</div>
        </div>
      </div>
      <button class="dropdown-item" (click)="goToProfile()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        Mi perfil
      </button>
      <div class="dropdown-divider"></div>
      <button class="dropdown-item danger" (click)="logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Cerrar sesión
      </button>
    </div>

  </div>
</header>
