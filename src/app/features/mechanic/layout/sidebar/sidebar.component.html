<!-- Overlay móvil -->
<div class="sidebar-overlay" [class.visible]="sidebarService.mobileOpen()" (click)="sidebarService.closeMobile()"></div>

<aside class="sidebar" [class.mobile-open]="sidebarService.mobileOpen()" [class.collapsed]="sidebarService.collapsed()">
  <!-- Logo -->
  <div class="sidebar__logo">
    <img src="assets/Logo.png" alt="Turbo Mechanics" class="logo-img" />
    <div class="logo-text" *ngIf="!sidebarService.collapsed()">
      <span class="logo-brand">TURBO</span>
      <span class="logo-sub">MECHANICS</span>
    </div>
  </div>
  <div class="sidebar__divider"></div>
  <!-- Nav -->
  <nav class="sidebar__nav">
    <span class="nav-section-label" *ngIf="!sidebarService.collapsed()">GESTIÓN</span>
    <a class="nav-item" routerLink="dashboard" routerLinkActive="active" title="Dashboard" (click)="sidebarService.closeMobile()">
      <span class="nav-icon"><i class="fas fa-chart-bar"></i></span>
      <span class="nav-label" *ngIf="!sidebarService.collapsed()">Dashboard</span>
    </a>
    <a class="nav-item" routerLink="clients" routerLinkActive="active" title="Clientes" (click)="sidebarService.closeMobile()">
      <span class="nav-icon"><i class="fas fa-users"></i></span>
      <span class="nav-label" *ngIf="!sidebarService.collapsed()">Clientes</span>
    </a>
    <a class="nav-item" routerLink="work-order" routerLinkActive="active" title="Órdenes de trabajo" (click)="sidebarService.closeMobile()">
      <span class="nav-icon"><i class="fas fa-clipboard-list"></i></span>
      <span class="nav-label" *ngIf="!sidebarService.collapsed()">Orden de Trabajo</span>
    </a>
    <a class="nav-item" routerLink="vehicles" routerLinkActive="active" title="Asociar Vehículo" (click)="sidebarService.closeMobile()">
      <span class="nav-icon"><i class="fas fa-link"></i></span>
      <span class="nav-label" *ngIf="!sidebarService.collapsed()">Asociar Vehículo</span>
    </a>
    <a class="nav-item" routerLink="vehicle-history" routerLinkActive="active" title="Historial" (click)="sidebarService.closeMobile()">
      <span class="nav-icon"><i class="fas fa-history"></i></span>
      <span class="nav-label" *ngIf="!sidebarService.collapsed()">Historial</span>
    </a>
    <a class="nav-item" routerLink="diagnosis" routerLinkActive="active" title="Diagnóstico" (click)="sidebarService.closeMobile()">
      <span class="nav-icon"><i class="fas fa-stethoscope"></i></span>
      <span class="nav-label" *ngIf="!sidebarService.collapsed()">Diagnóstico</span>
    </a>
    <a class="nav-item" routerLink="movements" routerLinkActive="active" title="Movimientos" (click)="sidebarService.closeMobile()">
      <span class="nav-icon"><i class="fas fa-dollar-sign"></i></span>
      <span class="nav-label" *ngIf="!sidebarService.collapsed()">Movimientos</span>
    </a>
    <a class="nav-item" routerLink="appointments" routerLinkActive="active" title="Citas" (click)="sidebarService.closeMobile()">
      <span class="nav-icon"><i class="fas fa-calendar-check"></i></span>
      <span class="nav-label" *ngIf="!sidebarService.collapsed()">Citas</span>
    </a>
    <a class="nav-item" routerLink="maintenance" routerLinkActive="active" title="Mantenimiento" (click)="sidebarService.closeMobile()">
      <span class="nav-icon"><i class="fas fa-wrench"></i></span>
      <span class="nav-label" *ngIf="!sidebarService.collapsed()">Mantenimiento</span>
    </a>
    <a class="nav-item" routerLink="mecanicos" routerLinkActive="active" title="Mecánicos" (click)="sidebarService.closeMobile()">
      <span class="nav-icon"><i class="fas fa-hard-hat"></i></span>
      <span class="nav-label" *ngIf="!sidebarService.collapsed()">Mecánicos</span>
    </a>
    <a class="nav-item" routerLink="billing" routerLinkActive="active" title="Facturación" (click)="sidebarService.closeMobile()">
      <span class="nav-icon"><i class="fas fa-file-invoice-dollar"></i></span>
      <span class="nav-label" *ngIf="!sidebarService.collapsed()">Facturación</span>
    </a>
    <a class="nav-item" routerLink="garantias" routerLinkActive="active" title="Garantías" (click)="sidebarService.closeMobile()">
      <span class="nav-icon"><i class="fas fa-clipboard-check"></i></span>
      <span class="nav-label" *ngIf="!sidebarService.collapsed()">Garantías</span>
    </a>
    <a class="nav-item" routerLink="whatsapp" routerLinkActive="active" (click)="sidebarService.closeMobile()">
      <span class="nav-icon"><i class="fab fa-whatsapp"></i></span>
      <span class="nav-label">WhatsApp</span>
    </a>
  </nav>
</aside>
